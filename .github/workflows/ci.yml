name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx vitest run
      - run: npm run guide:check
      - run: npx -y axi-axi validate "node bin/affinity-axi.js" --dir . --timeout 30000
